<!DOCTYPE html>
<html lang="zh-tw">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Interview</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="landing-container">
            <header class="top-nav">
                <a href="index.html" class="text-logo">面試系統</a>
            </header>
            <hr>
            <div class="info-container">
            <form id="info-form">
                <div class="input-group">
                    <div class="last-name">
                        <label
                            class="required"
                            for="last-name"
                        >
                            姓氏
                        </label>
                        <input
                            type="text"
                            id="last-name"
                            maxlength="30"
                            required
                        >
                        <span
                            id="last-name-error"
                            class="field-error"
                        ></span>
                    </div>
                    <div class="first-name">
                        <label
                            class="required"
                            for="first-name"
                        >
                            名字
                        </label>
                        <input
                            type="text"
                            id="first-name"
                            maxlength="30"
                            required
                        >
                        <span
                            id="first-name-error"
                            class="field-error"
                        ></span>
                    </div>
                    <div class="phone">
                        <label
                            class="required"
                            for="phone"
                        >
                            行動電話
                        </label>
                        <input
                            type="tel"
                            id="phone"
                            inputmode="numeric"
                            maxlength="10"
                            placeholder="0912345678"
                            required
                        >
                        <span
                            id="phone-error"
                            class="field-error"
                        ></span>
                    </div>
                    <div class="gmail">
                        <label
                            class="required"
                            for="gmail"
                        >
                            電子郵件
                        </label>
                        <input
                            type="email"
                            id="gmail"
                            placeholder="abc@gmail.com"
                            required
                        >
                        <span
                            id="email-error"
                            class="field-error"
                        ></span>
                    </div>
                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        下一步
                    </button>
                </div>
            </form>

<script type="module" src="script.js"></script>            </div>
        </div>
    </body>
</html>
