<!DOCTYPE html>
<html lang="zh-tw">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Interview</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="landing-container">
            <header class="top-nav">
                <a href="index.html" class="text-logo">面試系統</a>
            </header>
            <hr>
            <div class="info-container">
                <form id="register-form">
                    <div class="input-group">
                        <div class="input-pass">
                            <label
                                class="required"
                                for="input-pass"
                            >
                                輸入密碼
                            </label>
                            <input
                                type="password"
                                id="input-pass"
                                minlength="6"
                                required
                            >
                        </div>
                        <div class="confirm-pass">
                            <label
                                class="required"
                                for="confirm-pass"
                            >
                                確認密碼
                            </label>
                            <input
                                type="password"
                                id="confirm-pass"
                                minlength="6"
                                required
                            >
                        </div>
                        <button
                            type="submit"
                            class="submit-btn"
                        >
                            註冊
                        </button>
                    </div>
                </form>
                <script
                    type="module"
                    src="script.js"
                ></script>            
            </div>        
        </div>
    </body>
</html>
