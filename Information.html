<!DOCTYPE html>
<html lang="zh-tw">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Interview</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="landing-container">
            <header class="top-nav">
                <a href="index.html" class="text-logo">面試系統</a>
            </header>
            <hr>
            <div class="info-container">
                <form action="register.html">
                    <div class="input-group is-required">
                        <div class="last-name">
                            <label
                                class="required"
                                for="last-name">姓氏
                            </label>
                            <input 
                                type="text"
                                id="first-name"
                                required
                            >
                        </div>
                        <div class="first-name is-required">
                            <label
                                class="required"
                                for="first-name">名字</label>
                            </label>
                            <input
                                type="text"
                                id="first-name"
                                required
                            >
                        </div>
                        <div class="phone is-required">
                            <label
                                class="required"
                                for="phone">行動電話
                            </label>
                            <input
                                type="tel"
                                id="phone"
                                required
                            >
                        </div>

                        <div class="gmail is-required">
                            <label
                                class="required"
                                for="gmail">電子郵件
                            </label>
                            <input
                                type="email"
                                id="gmail"
                                required
                            >
                        </div>
                        <button
                            type="submit"
                            class="submit-btn"
                        >
                            下一步
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
